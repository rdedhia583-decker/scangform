<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event QR Check-In Scanner</title>
    <!-- Html5Qrcode Library for Camera Scanning -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 20px; }
        .config-box {
            margin-bottom: 20px;
            text-align: left;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #ddd;
        }
        /* Status Flash Card Styling */
        #status-card {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            display: none;
            transition: all 0.3s ease;
        }
        .allowed { background-color: #2ec4b6; color: white; border: 2px solid #0f9f90; }
        .already-scanned { background-color: #e71d36; color: white; border: 2px solid #b71224; }
        .not-found { background-color: #ff9f1c; color: white; border: 2px solid #d47a00; }
        .scanning { background-color: #e0e0e0; color: #666; }
        
        #ticket-details {
            margin-top: 10px;
            font-size: 14px;
            font-weight: normal;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎟️ Event Ticket Scanner</h2>
    
    <!-- Apps Script URL Configuration -->
    <div class="config-box">
        <label style="font-weight: 600; display:block; margin-bottom:5px;">Google Apps Script Web App URL:</label>
        <input type="text" id="scriptUrl" placeholder="https://google.com" />
    </div>

    <!-- Scanner Camera Viewport -->
    <div id="reader"></div>

    <!-- Flash Result Card -->
    <div id="status-card">
        <div id="status-message">Ready to Scan</div>
        <div id="ticket-details"></div>
    </div>
</div>

<script>
    let html5QrcodeScanner;
    let isProcessing = false; // Multi-scanning ko rokne ke liye loop breaker

    function initScanner() {
        html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: { width: 250, height: 250 } }
        );
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    // Jab QR Code successfully scan hoga
    function onScanSuccess(decodedText, decodedResult) {
        if (isProcessing) return; // Agar pehle wala ticket abhi verify ho raha h to ruko
        
        const webAppUrl = document.getElementById('scriptUrl').value.trim();
        if (!webAppUrl) {
            alert("Pehle apna Google Apps Script Web App URL upar box me daalein!");
            return;
        }

        isProcessing = true;
        showStatus('scanning', 'Verifying Ticket...', 'Checking backend database...');

        // Google Apps Script Web App ko request bhejna (CORS handler ke saath)
        fetch(`${webAppUrl}?qrData=${encodeURIComponent(decodedText)}`)
            .then(response => response.json())
            .then(data => {
                // Flash message conditions
                if (data.status === "ALLOWED") {
                    showStatus('allowed', '✅ CHECK-IN ALLOWED', `Ticket ID: ${decodedText}`);
                } else if (data.status === "ALREADY_SCAN") {
                    showStatus('already-scanned', '❌ ALREADY CHECKED IN!', `Scanned Again: ${decodedText}`);
                } else {
                    showStatus('not-found', '⚠️ INVALID TICKET / NOT FOUND', `Data: ${decodedText}`);
                }
                
                // 3 seconds baad scanner ko agla ticket scan karne ke liye ready karna
                setTimeout(() => {
                    isProcessing = false;
                    resetStatus();
                }, 3000);
            })
            .catch(error => {
                console.error("Error verifying ticket:", error);
                showStatus('not-found', '⚠️ NETWORK ERROR', 'Check console or Apps Script deployment permissions.');
                setTimeout(() => { isProcessing = false; }, 3000);
            });
    }

    function onScanFailure(error) {
        // Har frame fail hone par handle karne ki zarurat nahi hai (Library defaults it)
    }

    function showStatus(className, message, details) {
        const card = document.getElementById('status-card');
        const msgDiv = document.getElementById('status-message');
        const detailsDiv = document.getElementById('ticket-details');
        
        card.className = className;
        card.style.display = 'block';
        msgDiv.innerText = message;
        detailsDiv.innerText = details;
    }

    function resetStatus() {
        document.getElementById('status-card').style.display = 'none';
    }

    // Page load hote hi scanner load karein
    window.addEventListener('DOMContentLoaded', initScanner);
</script>

</body>
</html>
